name: Test data structures and functions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Compile example modules
        run: python -m compileall -q data_cleaning.py functions_examples.py tests
      - name: Run automated tests
        run: python -m unittest discover -s tests -v
